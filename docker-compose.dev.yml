services:
  db:
    image: postgres:16-alpine
    container_name: nexustrade_db_dev
    environment:
      POSTGRES_USER: nexustrade
      POSTGRES_PASSWORD: nexustrade123
      POSTGRES_DB: nexustrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Use the 'deps' stage so we have node_modules, but skip the 'build'
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: nexustrade_dev
    command: sh -c "if [ -d prisma/migrations ]; then npm run prisma:migrate:deploy; else npm run prisma:migrate:init; fi && npm run dev" # Run migrations then start dev server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nexustrade:nexustrade123@db:5432/nexustrade?schema=public
      - NODE_ENV=development
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - .:/app # Syncs your code in real-time
      - /app/node_modules # Keeps container dependencies isolated
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev: