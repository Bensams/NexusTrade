services:
  db:
    image: postgres:16-alpine
    container_name: nexustrade_db
    environment:
      POSTGRES_USER: nexustrade
      POSTGRES_PASSWORD: nexustrade123
      POSTGRES_DB: nexustrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexustrade_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nexustrade:nexustrade123@db:5432/nexustrade?schema=public
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
